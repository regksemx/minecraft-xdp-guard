<svg xmlns="http://www.w3.org/2000/svg" width="880" height="372" viewBox="0 0 880 372" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The price: newcomers wait for one retransmit">
<title>The price: newcomers wait for one retransmit</title>
<rect x="0.5" y="0.5" width="879" height="371" rx="8" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
<line x1="64.0" y1="272.6" x2="852.0" y2="272.6" stroke="#e7e7e7" stroke-width="1"/>
<line x1="64.0" y1="213.1" x2="852.0" y2="213.1" stroke="#e7e7e7" stroke-width="1"/>
<line x1="64.0" y1="153.7" x2="852.0" y2="153.7" stroke="#e7e7e7" stroke-width="1"/>
<text x="24.0" y="34.0" font-size="17" font-weight="600" fill="#191919" text-anchor="start">The price: newcomers wait for one retransmit</text>
<text x="24.0" y="56.0" font-size="12.5" font-weight="400" fill="#666666" text-anchor="start">Login time of a player from an address the filter has never seen. While a flood of unknown addresses is</text>
<text x="24.0" y="74.0" font-size="12.5" font-weight="400" fill="#666666" text-anchor="start">on, and 30 s after it, the first SYN is dropped and the retransmit gets in. Returning players: 0-5 ms.</text>
<line x1="24.0" y1="102.0" x2="40.0" y2="102.0" stroke="#f47230" stroke-width="2.5"/>
<text x="46.0" y="106.0" font-size="12.5" font-weight="400" fill="#666666" text-anchor="start">without the filter</text>
<line x1="186.8" y1="102.0" x2="202.8" y2="102.0" stroke="#257de0" stroke-width="2.5"/>
<text x="208.8" y="106.0" font-size="12.5" font-weight="400" fill="#666666" text-anchor="start">with the filter</text>
<rect x="113.9" y="124.0" width="60.4" height="208.0" rx="3" fill="#f3f4f6"/>
<text x="144.1" y="139.0" font-size="11" font-weight="400" fill="#666666" text-anchor="middle">SYN</text>
<rect x="203.7" y="124.0" width="60.0" height="208.0" rx="3" fill="#f3f4f6"/>
<text x="233.7" y="139.0" font-size="11" font-weight="400" fill="#666666" text-anchor="middle">ACK</text>
<rect x="293.4" y="124.0" width="60.4" height="208.0" rx="3" fill="#f3f4f6"/>
<text x="323.6" y="139.0" font-size="11" font-weight="400" fill="#666666" text-anchor="middle">Handshake</text>
<rect x="383.2" y="124.0" width="61.5" height="208.0" rx="3" fill="#f3f4f6"/>
<text x="414.0" y="139.0" font-size="11" font-weight="400" fill="#666666" text-anchor="middle">SYN+retry</text>
<rect x="473.0" y="124.0" width="60.3" height="208.0" rx="3" fill="#f3f4f6"/>
<text x="503.1" y="139.0" font-size="11" font-weight="400" fill="#666666" text-anchor="middle">Ping</text>
<rect x="562.7" y="124.0" width="60.4" height="208.0" rx="3" fill="#f3f4f6"/>
<text x="592.9" y="139.0" font-size="11" font-weight="400" fill="#666666" text-anchor="middle">Connect</text>
<rect x="652.5" y="124.0" width="60.1" height="208.0" rx="3" fill="#f3f4f6"/>
<text x="682.6" y="139.0" font-size="11" font-weight="400" fill="#666666" text-anchor="middle">STUN</text>
<rect x="742.3" y="124.0" width="60.3" height="208.0" rx="3" fill="#f3f4f6"/>
<text x="772.5" y="139.0" font-size="11" font-weight="400" fill="#666666" text-anchor="middle">Junk</text>
<text x="64.0" y="350.0" font-size="11" font-weight="400" fill="#666666" text-anchor="middle" style="font-variant-numeric:tabular-nums">0 s</text>
<text x="163.7" y="350.0" font-size="11" font-weight="400" fill="#666666" text-anchor="middle" style="font-variant-numeric:tabular-nums">10 s</text>
<text x="263.5" y="350.0" font-size="11" font-weight="400" fill="#666666" text-anchor="middle" style="font-variant-numeric:tabular-nums">20 s</text>
