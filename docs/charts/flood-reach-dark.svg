<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="What reaches the server during a flood">
<title>What reaches the server during a flood</title>
<rect x="0.5" y="0.5" width="879" height="399" rx="8" fill="#0d1117" stroke="rgba(255,255,255,0.10)"/>
<line x1="64.0" y1="320.7" x2="852.0" y2="320.7" stroke="#262c36" stroke-width="1"/>
<line x1="64.0" y1="281.3" x2="852.0" y2="281.3" stroke="#262c36" stroke-width="1"/>
<line x1="64.0" y1="242.0" x2="852.0" y2="242.0" stroke="#262c36" stroke-width="1"/>
<line x1="64.0" y1="202.7" x2="852.0" y2="202.7" stroke="#262c36" stroke-width="1"/>
<line x1="64.0" y1="163.3" x2="852.0" y2="163.3" stroke="#262c36" stroke-width="1"/>
<text x="24.0" y="34.0" font-size="17" font-weight="600" fill="#efefef" text-anchor="start">What reaches the server during a flood</text>
<text x="24.0" y="56.0" font-size="12.5" font-weight="400" fill="#9c9c9c" text-anchor="start">Packets per second arriving at the server's network stack during eight spoofed floods at 1.49 Mpps, the rate of</text>
<text x="24.0" y="74.0" font-size="12.5" font-weight="400" fill="#9c9c9c" text-anchor="start">a saturated 1 Gbit/s port (the retransmitting SYN flood runs at 50K pps). Log scale.</text>
<line x1="24.0" y1="102.0" x2="40.0" y2="102.0" stroke="#e76624" stroke-width="2.5"/>
<text x="46.0" y="106.0" font-size="12.5" font-weight="400" fill="#9c9c9c" text-anchor="start">without the filter: 1.49M pps reach the server</text>
<line x1="371.6" y1="102.0" x2="387.6" y2="102.0" stroke="#338ced" stroke-width="2.5"/>
<text x="393.6" y="106.0" font-size="12.5" font-weight="400" fill="#9c9c9c" text-anchor="start">with the filter: ~140 pps, only the players</text>
<rect x="113.9" y="124.0" width="60.4" height="236.0" rx="3" fill="#161b22"/>
<text x="144.1" y="139.0" font-size="11" font-weight="400" fill="#9c9c9c" text-anchor="middle">SYN</text>
<rect x="203.7" y="124.0" width="60.0" height="236.0" rx="3" fill="#161b22"/>
<text x="233.7" y="139.0" font-size="11" font-weight="400" fill="#9c9c9c" text-anchor="middle">ACK</text>
<rect x="293.4" y="124.0" width="60.4" height="236.0" rx="3" fill="#161b22"/>
<text x="323.6" y="139.0" font-size="11" font-weight="400" fill="#9c9c9c" text-anchor="middle">Handshake</text>
<rect x="383.2" y="124.0" width="61.5" height="236.0" rx="3" fill="#161b22"/>
<text x="414.0" y="139.0" font-size="11" font-weight="400" fill="#9c9c9c" text-anchor="middle">SYN+retry</text>
<rect x="473.0" y="124.0" width="60.3" height="236.0" rx="3" fill="#161b22"/>
<text x="503.1" y="139.0" font-size="11" font-weight="400" fill="#9c9c9c" text-anchor="middle">Ping</text>
<rect x="562.7" y="124.0" width="60.4" height="236.0" rx="3" fill="#161b22"/>
<text x="592.9" y="139.0" font-size="11" font-weight="400" fill="#9c9c9c" text-anchor="middle">Connect</text>
<rect x="652.5" y="124.0" width="60.1" height="236.0" rx="3" fill="#161b22"/>
<text x="682.6" y="139.0" font-size="11" font-weight="400" fill="#9c9c9c" text-anchor="middle">STUN</text>
<rect x="742.3" y="124.0" width="60.3" height="236.0" rx="3" fill="#161b22"/>
<text x="772.5" y="139.0" font-size="11" font-weight="400" fill="#9c9c9c" text-anchor="middle">Junk</text>
<text x="64.0" y="378.0" font-size="11" font-weight="400" fill="#9c9c9c" text-anchor="middle" style="font-variant-numeric:tabular-nums">0 s</text>
<text x="163.7" y="378.0" font-size="11" font-weight="400" fill="#9c9c9c" text-anchor="middle" style="font-variant-numeric:tabular-nums">10 s</text>
